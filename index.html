<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sofia Transport Live</title>
  <meta name="description" content="Live buses, trams and trolleybuses in Sofia from the official real-time feed, with metro trains estimated from the timetable.">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16191e" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 -960 960 960'%3E%3Crect y='-960' width='960' height='960' rx='210' fill='%232d54a4'/%3E%3Cpath fill='white' transform='translate(144 -144) scale(0.7)' d='M320-200v20q0 25-17.5 42.5T260-120q-25 0-42.5-17.5T200-180v-62q-18-20-29-44.5T160-340v-380q0-83 77-121.5T480-880q172 0 246 37t74 123v380q0 29-11 53.5T760-242v62q0 25-17.5 42.5T700-120q-25 0-42.5-17.5T640-180v-20H320Zm-80-360h480v-120H240v120Zm142.5 222.5Q400-355 400-380t-17.5-42.5Q365-440 340-440t-42.5 17.5Q280-405 280-380t17.5 42.5Q315-320 340-320t42.5-17.5Zm280 0Q680-355 680-380t-17.5-42.5Q645-440 620-440t-42.5 17.5Q560-405 560-380t17.5 42.5Q595-320 620-320t42.5-17.5Z'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="preconnect" href="https://unpkg.com" crossorigin>
  <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin>
  <link rel="preconnect" href="https://gtfs.sofiatraffic.bg" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sofia+Sans:wght@400;500;600;700;800&family=Sofia+Sans+Condensed:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..600,0..1,0&icon_names=arrow_back,bedtime,chevron_right,close,directions_bus,directions_run,directions_walk,filter_alt,layers,menu,my_location,pin_drop,route,schedule,search,swap_vert,tram,transfer_within_a_station&display=block">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="style.css?v=60">
</head>
<body>
  <div id="map"></div>

  <!-- Left button rail -->
  <nav id="rail" aria-label="Tools">
    <button class="rail-btn" data-panel="menu" data-i18n-title="menu">
      <span class="ms" aria-hidden="true">menu</span></button>
    <button class="rail-btn" data-panel="search" data-i18n-title="search">
      <span class="ms" aria-hidden="true">search</span></button>
    <button class="rail-btn" data-panel="filter" data-i18n-title="filter">
      <span class="ms" aria-hidden="true">filter_alt</span><span class="rail-dot" id="filter-dot" hidden></span></button>
    <button class="rail-btn" data-panel="layers" data-i18n-title="layers">
      <span class="ms" aria-hidden="true">layers</span></button>
    <button class="rail-btn" id="locate" data-i18n-title="locate">
      <span class="ms" aria-hidden="true">my_location</span></button>
  </nav>

  <!-- Status chip: clock and live feed state -->
  <div id="status">
    <span id="status-clock">--:--:--</span>
    <span id="status-feed" class="feed-dot"></span>
    <span id="status-text"></span>
  </div>

  <!-- Tool panels (one at a time) -->
  <section class="panel" id="panel-search" hidden>
    <div class="panel-head">
      <input type="search" id="search-input" autocomplete="off" spellcheck="false" data-i18n-placeholder="searchPlaceholder">
      <button class="icon-btn panel-close" aria-label="Close"><span class="ms" aria-hidden="true">close</span></button>
    </div>
    <div id="search-results" class="list"></div>
  </section>

  <section class="panel" id="panel-filter" hidden>
    <div class="panel-head"><h2 data-i18n="filter"></h2><button class="icon-btn panel-close" aria-label="Close"><span class="ms" aria-hidden="true">close</span></button></div>
    <div class="panel-body">
      <h3 data-i18n="vehicleTypes"></h3>
      <div id="kind-filter" class="chips"></div>
      <h3 data-i18n="lines"></h3>
      <input type="search" id="line-filter-input" autocomplete="off" data-i18n-placeholder="lineFilterPlaceholder">
      <div id="line-filter" class="chips lines"></div>
      <button id="filter-reset" class="btn" data-i18n="resetFilter"></button>
    </div>
  </section>

  <section class="panel" id="panel-layers" hidden>
    <div class="panel-head"><h2 data-i18n="mapStyle"></h2><button class="icon-btn panel-close" aria-label="Close"><span class="ms" aria-hidden="true">close</span></button></div>
    <div class="panel-body">
      <div class="seg" id="style-choice">
        <button data-style="vector" data-i18n="styleVector"></button>
        <button data-style="osm" data-i18n="styleOsm"></button>
      </div>
      <p class="hint" id="style-hint"></p>
      <h3 data-i18n="theme"></h3>
      <div class="seg" id="theme-choice">
        <button data-theme="auto" data-i18n="themeAuto"></button>
        <button data-theme="light" data-i18n="themeLight"></button>
        <button data-theme="dark" data-i18n="themeDark"></button>
      </div>
      <h3 data-i18n="display"></h3>
      <label class="check"><input type="checkbox" id="show-bodies"> <span data-i18n="showBodies"></span></label>
      <label class="check"><input type="checkbox" id="show-stops"> <span data-i18n="showStops"></span></label>
      <label class="check"><input type="checkbox" id="show-untracked"> <span data-i18n="showUntracked"></span></label>
    </div>
  </section>

  <section class="panel" id="panel-menu" hidden>
    <div class="panel-head"><h2 data-i18n="appTitle"></h2><button class="icon-btn panel-close" aria-label="Close"><span class="ms" aria-hidden="true">close</span></button></div>
    <div class="panel-body">
      <h3 data-i18n="language"></h3>
      <div class="seg" id="lang-choice"><button data-lang="bg">Български</button><button data-lang="en">English</button></div>

      <h3 data-i18n="counts"></h3>
      <div id="counts" class="counts"></div>

      <h3 data-i18n="metroTime"></h3>
      <p class="hint" data-i18n="metroTimeHint"></p>
      <div class="row">
        <input type="datetime-local" id="sim-time" step="60">
        <button id="live-btn" class="btn primary" data-i18n="now"></button>
      </div>
      <div class="seg" id="speed">
        <button data-speed="1">1×</button><button data-speed="10">10×</button><button data-speed="60">60×</button><button data-speed="300">300×</button>
      </div>
      <label for="delay" class="small-label" data-i18n="metroDelay"></label>
      <div class="row">
        <input type="number" id="delay" step="5" min="-600" max="600" inputmode="numeric">
        <button id="delay-reset" class="btn" data-i18n="reset"></button>
      </div>

      <h3 data-i18n="about"></h3>
      <p class="hint" id="about"></p>
    </div>
  </section>

  <!-- Detail card (vehicle / stop / line) -->
  <aside id="card" hidden>
    <button class="icon-btn" id="card-close" aria-label="Close"><span class="ms" aria-hidden="true">close</span></button>
    <div id="card-body"></div>
  </aside>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="data/metro.js?v=60"></script>
  <script src="data/transit.js?v=60"></script>
  <script src="data/shapes.js?v=60"></script>
  <script src="js/fleet.js?v=60"></script>
  <script src="js/basemap.js?v=60"></script>
  <script src="js/core.js?v=60"></script>
  <script src="js/metro.js?v=60"></script>
  <script src="js/live.js?v=60"></script>
  <script src="js/plan.js?v=60"></script>
</body>
</html>
