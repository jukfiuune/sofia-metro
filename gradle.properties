# Kept small: the dev machine also runs the emulator (16 GB total).
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.caching=true
org.gradle.configuration-cache=true
# Compile Kotlin inside the Gradle daemon instead of a second large JVM.
kotlin.compiler.execution.strategy=in-process
kotlin.code.style=official
# iOS targets only build on macOS; skip them quietly elsewhere.
kotlin.native.ignoreDisabledTargets=true
android.useAndroidX=true
android.nonTransitiveRClass=true
